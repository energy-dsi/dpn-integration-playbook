                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/12/key == \"pipeline.role\""
                overwrite_if_key_exists: false
              - key: "log._role"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/13/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/13/key == \"pipeline.role\""
                overwrite_if_key_exists: false
              - key: "log._role"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/14/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/14/key == \"pipeline.role\""
                overwrite_if_key_exists: false
        # ── Step 4: reconstruct the heartbeat-style compound component name
        - add_entries:
            entries:
              - key: "log.component"
                value_expression: "/log/_role + \"-\" + /log/_type + \"-\" + /log/_stage"
                add_when: "/log/_stage != null and /log/_type != null and /log/_role != null"
                overwrite_if_key_exists: false
        # ── Step 5: fall back log.component to log.service when still not set ────
        - add_entries:
            entries:
              - key: "log.component"
                value_expression: "/log/service"
                add_when: "/log/service != null"
                overwrite_if_key_exists: false
        # Drop the raw OTLP envelope now that its useful fields have been
        # flattened into log.* — prevents field-type mapping conflicts.
        - delete_entries:
            with_keys: ["resourceLogs"]
        - date:
            from_time_received: true
            destination: "@timestamp"
      sink:
        - opensearch:
            hosts:
              - "http://dpn-opensearch-health.ns-dpn-health-01.svc.cluster.local:9200"
            index: otel-logs-%{yyyy.MM.dd}
            index_type: custom
            bulk_size: 4

    otel-metrics-pipeline:
      source:
        kafka:
          encryption:
            type: none
          bootstrap_servers:
            - "dpn-kafka-health.ns-dpn-health-01.svc.cluster.local:9092"
          topics:
            - name: otel-metrics
              group_id: data-prepper-metrics
      processor:
        - parse_json: {}
      sink:
        - opensearch:
            hosts:
              - "http://dpn-opensearch-health.ns-dpn-health-01.svc.cluster.local:9200"
            index: otel-metrics-%{yyyy.MM.dd}
            index_type: custom
            bulk_size: 4

    otel-traces-pipeline:
      source:
        kafka:
          encryption:
            type: none
          bootstrap_servers:
            - "dpn-kafka-health.ns-dpn-health-01.svc.cluster.local:9092"
          topics:
            - name: otel-traces
              group_id: data-prepper-traces
      processor:
        - parse_json: {}
      sink:
        - opensearch:
            hosts:
              - "http://dpn-opensearch-health.ns-dpn-health-01.svc.cluster.local:9200"
            index: otel-traces-%{yyyy.MM.dd}
            index_type: custom
            bulk_size: 4

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpn-data-prepper-health
  namespace: ns-dpn-health-01
  labels:
    app: dpn-data-prepper-health
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dpn-data-prepper-health
  template:
    metadata:
      labels:
        app: dpn-data-prepper-health
      annotations:
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: "false"
        cloudwatch.aws.amazon.com/auto-annotate-python: "false"
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: data-prepper
          image: "opensearchproject/data-prepper:2.6.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 4900
          volumeMounts:
            - name: config
              mountPath: /usr/share/data-prepper/pipelines/pipelines.yaml
              subPath: pipelines.yaml
            - name: config
              mountPath: /usr/share/data-prepper/config/data-prepper-config.yaml
              subPath: data-prepper-config.yaml
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 600m
              memory: 768Mi
      volumes:
        - name: config
          configMap:
            name: dpn-data-prepper-health

---
apiVersion: v1
kind: Service
metadata:
  name: dpn-data-prepper-health
  namespace: ns-dpn-health-01
  labels:
    app: dpn-data-prepper-health
spec:
  type: ClusterIP
  selector:
    app: dpn-data-prepper-health
  ports:
    - name: http
      port: 4900
      targetPort: 4900
      protocol: TCP
