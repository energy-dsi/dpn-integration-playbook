                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/14/key == \"pipeline.type\""
                overwrite_if_key_exists: false
        - add_entries:
            entries:
              - key: "log._role"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/0/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/0/key == \"pipeline.role\""
              - key: "log._role"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/1/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/1/key == \"pipeline.role\""
                overwrite_if_key_exists: false
              - key: "log._role"
                value_expression: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/2/value/stringValue"
                add_when: "/resourceLogs/0/scopeLogs/0/logRecords/0/attributes/2/key == \"pipeline.role\""
