# ===== deploy/dpn-producer-topic-adaptor-eqbd-pg-gas =====
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dpn-producer-topic-adaptor-eqbd-pg-gas
  name: dpn-producer-topic-adaptor-eqbd-pg-gas
  namespace: ns-dpn-01
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dpn-producer-topic-adaptor-eqbd-pg-gas
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dpn-producer-topic-adaptor-eqbd-pg-gas
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - python
        - main.py
        env:
        - name: bootstrapServer
          value: dpn-kafka-src:9092
        - name: srcTopicName
          value: dpn-producer-eqbd-pg-gas-stage
        - name: mapperTopicName
          value: dpn-producer-eqbd-pg-gas-raw
        - name: srcGroupId
          value: producer_topic_eqbd_pg_gas_test
        - name: consumerRetryDelaySecs
          value: '5'
        - name: namespace
          value: ns-dpn-01
        - name: name
          value: dpn-producer-topic-adaptor-eqbd-pg-gas
        - name: imageName
          value: producer-topic-adaptor-eqbd
        - name: PRODUCT_NAME
          value: eqbd-pg-gas
        - name: SCHEDULER_BACKEND
          value: kafka-trigger
        - name: EXECUTION_MODE
          value: manual
        - name: scheduleInterval
          value: '240'
        - name: replicaCount
          value: '1'
        - name: PIPELINE_CONTROL_TOPIC
          value: dpn-pipeline-control
        - name: PIPELINE_STATUS_TOPIC
          value: dpn-pipeline-status
        - name: DRAIN_IDLE_SECS
          value: '15'
        - name: TOPIC_TASK_TIMEOUT_SECS
          value: '60'
        - name: statsdPort
          value: '8125'
        - name: SERVICE_NAME
          value: dpn data pipeline
        - name: SERVICE_VERSION
          value: 1.0.0
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: dpn-otel-collector.ns-dpn-health-01.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: ENVIRONMENT
          value: development
        image: ghcr.io/energy-dsi/producer-topic-adaptor-eqbd:1.0.0
        imagePullPolicy: Always
        name: dpn-producer-topic-adaptor-eqbd-pg-gas
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10000
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-pull-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: federator-server
      serviceAccountName: federator-server
      terminationGracePeriodSeconds: 30
