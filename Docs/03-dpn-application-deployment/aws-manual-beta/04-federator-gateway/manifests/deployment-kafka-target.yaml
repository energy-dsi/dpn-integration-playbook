# ===== deploy/dpn-kafka-target =====
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dpn-kafka-target
  name: dpn-kafka-target
  namespace: ns-dpn-01
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dpn-kafka-target
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: 'false'
        cloudwatch.aws.amazon.com/auto-annotate-java: 'false'
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: 'false'
        cloudwatch.aws.amazon.com/auto-annotate-python: 'false'
        instrumentation.opentelemetry.io/inject-dotnet: 'false'
        instrumentation.opentelemetry.io/inject-java: 'false'
        instrumentation.opentelemetry.io/inject-nodejs: 'false'
        instrumentation.opentelemetry.io/inject-python: 'false'
      labels:
        app: dpn-kafka-target
    spec:
      containers:
      - env:
        - name: KAFKA_BROKER_ID
          value: '1'
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: dpn-zookeeper-target:2181
        - name: KAFKA_LISTENERS
          value: INTERNAL://0.0.0.0:9092,INTERNAL_FQDN://0.0.0.0:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: INTERNAL://dpn-kafka-target:9092,INTERNAL_FQDN://dpn-kafka-target.ns-dpn-01.svc.cluster.local:9093
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: INTERNAL:PLAINTEXT,INTERNAL_FQDN:PLAINTEXT
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_MESSAGE_MAX_BYTES
          value: '10485760'
        - name: KAFKA_REPLICA_FETCH_MAX_BYTES
          value: '10485760'
        image: confluentinc/cp-kafka:7.5.3
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 40
          periodSeconds: 20
          successThreshold: 1
          tcpSocket:
            port: 9092
          timeoutSeconds: 1
        name: kafka
        ports:
        - containerPort: 9092
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 9092
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-pull-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
