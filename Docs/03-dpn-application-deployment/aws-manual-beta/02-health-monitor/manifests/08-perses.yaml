apiVersion: v1
kind: ConfigMap
metadata:
  name: dpn-perses
  namespace: ns-dpn-health-01
  labels:
    app.kubernetes.io/name: perses
data:
  config.yaml: |
    api_prefix: ""
    database:
      file:
        extension: json
        folder: /data
    frontend:
      explorer:
        enable: true
    provisioning:
      folders:
        - /etc/perses/provisioning
      interval: 10m
    security:
      enable_auth: false
      authorization: {}
      cookie:
        same_site: lax
        secure: false
      readonly: false

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dpn-perses-data
  namespace: ns-dpn-health-01
  labels:
    app.kubernetes.io/name: perses
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: efs-sc
  resources:
    requests:
      storage: 8Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpn-perses
  namespace: ns-dpn-health-01
  labels:
    app.kubernetes.io/name: perses
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: perses
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perses
      annotations:
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: "false"
        cloudwatch.aws.amazon.com/auto-annotate-python: "false"
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: "false"
    spec:
      securityContext:
        fsGroup: 2000
      containers:
        - name: perses
          image: "persesdev/perses:v0.53.1"
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/perses/config/config.yaml
            - --web.listen-address=:8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 2000
          resources:
            requests:
              cpu: 60m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/perses/config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: dpn-perses
        - name: data
          persistentVolumeClaim:
            claimName: dpn-perses-data

---
apiVersion: v1
kind: Service
metadata:
  name: dpn-perses-health
  namespace: ns-dpn-health-01
  labels:
    app.kubernetes.io/name: perses
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: perses
  ports:
    - name: http
      port: 8083
      targetPort: 8080
      protocol: TCP
