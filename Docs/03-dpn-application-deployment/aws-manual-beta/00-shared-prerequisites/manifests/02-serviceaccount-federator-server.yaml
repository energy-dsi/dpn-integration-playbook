# =============================================================================
# ServiceAccount used by Vault, certificate-manager, and every pod in the
# federator gateway component (serviceAccountName: federator-server).
#
# The role-arn annotation below is OPTIONAL. Every workload in this repo
# currently authenticates to AWS using access-key/secret Secrets rather than
# IRSA, so this annotation has no functional effect today. Leave it as a
# placeholder, or replace it with a real IAM role ARN if you later move
# workloads over to IRSA (the role's trust policy must allow
# sts:AssumeRoleWithWebIdentity for this ServiceAccount's OIDC subject:
# system:serviceaccount:ns-dpn-01:federator-server).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: federator-server
  namespace: ns-dpn-01
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/<EKS_IRSA_ROLE_NAME>"
