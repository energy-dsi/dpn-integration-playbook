apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpn-file-scan-service
  namespace: ns-dpn-01
  annotations:
    eks.amazonaws.com/role-arn: "<IRSA_ROLE_ARN>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dpn-file-scan-service-config
  namespace: ns-dpn-01
data:
  CLOUD_PROVIDER_TYPE: "S3"
  AWS_REGION: "<AWS_REGION>"
  S3_BUCKET_INBOUND: "<INBOUND_BUCKET>"
  S3_BUCKET_OUTBOUND: "<OUTBOUND_BUCKET>"
  SQS_QUEUE: "<SQS_QUEUE_URL>"
  SNS_TOPIC: "<SNS_TOPIC_ARN>"
  S3_VERIFY_SSL: "true"
  ENABLE_TELEMETRY: "true"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpn-file-scan-service
  namespace: ns-dpn-01
  labels:
    app: dpn-file-scan-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dpn-file-scan-service
  template:
    metadata:
      labels:
        app: dpn-file-scan-service
    spec:
      serviceAccountName: dpn-file-scan-service
      containers:
        - name: dpn-file-scan-service
          image: "<FILE_SCAN_SERVICE_IMAGE>"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: dpn-file-scan-service-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dpn-file-scan-service
  namespace: ns-dpn-01
spec:
  selector:
    app: dpn-file-scan-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
