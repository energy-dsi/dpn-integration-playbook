# ===== deploy/dpn-airflow-webserver =====
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dpn-airflow-webserver
  name: dpn-airflow-webserver
  namespace: ns-dpn-01
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dpn-airflow-webserver
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: 'true'
        cloudwatch.aws.amazon.com/auto-annotate-java: 'true'
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: 'true'
        cloudwatch.aws.amazon.com/auto-annotate-python: 'true'
        instrumentation.opentelemetry.io/inject-dotnet: 'true'
        instrumentation.opentelemetry.io/inject-java: 'true'
        instrumentation.opentelemetry.io/inject-nodejs: 'true'
        instrumentation.opentelemetry.io/inject-python: 'true'
      labels:
        app: dpn-airflow-webserver
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - airflow
        - webserver
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: dpn-airflow-secrets
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@dpn-airflow-postgres:5432/airflow
        - name: AIRFLOW__CELERY__RESULT_BACKEND
          value: db+postgresql://airflow:${POSTGRES_PASSWORD}@dpn-airflow-postgres:5432/airflow
        - name: AIRFLOW__CORE__FERNET_KEY
          valueFrom:
            secretKeyRef:
              key: FERNET_KEY
              name: dpn-airflow-secrets
        - name: AIRFLOW__WEBSERVER__SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: WEB_SECRET_KEY
              name: dpn-airflow-secrets
        envFrom:
        - configMapRef:
            name: dpn-airflow-config
        - secretRef:
            name: dpn-airflow-secrets
        image: ghcr.io/energy-dsi/dpn-airflow:1.0.0
        imagePullPolicy: Always
        name: dpn-airflow-webserver
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 50000
          runAsNonRoot: true
          runAsUser: 50000
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/airflow/dags/dpn_consumer_file.py
          name: dpn-airflow-dags
          subPath: dpn_consumer_file.py
        - mountPath: /opt/airflow/dags/dpn_consumer_topic.py
          name: dpn-airflow-dags
          subPath: dpn_consumer_topic.py
        - mountPath: /opt/airflow/dags/dpn_producer_file_bp_natural_gas.py
          name: dpn-airflow-dags
          subPath: dpn_producer_file_bp_natural_gas.py
        - mountPath: /opt/airflow/dags/dpn_producer_file_hp_natural_oil.py
          name: dpn-airflow-dags
          subPath: dpn_producer_file_hp_natural_oil.py
        - mountPath: /opt/airflow/dags/dpn_producer_topic_eq_neso_oil.py
          name: dpn-airflow-dags
          subPath: dpn_producer_topic_eq_neso_oil.py
        - mountPath: /opt/airflow/dags/dpn_producer_topic_eqbd_pg_gas.py
          name: dpn-airflow-dags
          subPath: dpn_producer_topic_eqbd_pg_gas.py
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-pull-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: dpn-airflow-dags
        name: dpn-airflow-dags
