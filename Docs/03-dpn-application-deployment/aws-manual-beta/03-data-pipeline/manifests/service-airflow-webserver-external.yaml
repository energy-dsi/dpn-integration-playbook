# ===== svc/dpn-airflow-webserver-external =====
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
  name: dpn-airflow-webserver-external
  namespace: ns-dpn-01
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  loadBalancerClass: service.k8s.aws/nlb
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: dpn-airflow-webserver
  type: LoadBalancer
