# ===== deploy/dpn-consumer-topic-extractor =====
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dpn-consumer-topic-extractor
  name: dpn-consumer-topic-extractor
  namespace: ns-dpn-01
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dpn-consumer-topic-extractor
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dpn-consumer-topic-extractor
    spec:
      automountServiceAccountToken: true
      containers:
      - command:
        - python
        - main.py
        env:
        - name: bootstrapServer
          value: dpn-kafka-target:9092
        - name: srcTopicName
          value: dp-consumer-topic-stage  # bug fix: standardized spelling (was "dp-consumer-topic-stage" here already, matches mapper below and the topic-creation list)
        - name: mapperTopicName
          value: dpn-consumer-topic-trfm
        - name: srcGroupId
          value: consumer_topic_eqbd_pg_gas_test
        - name: consumerRetryDelaySecs
          value: '5'
        - name: namespace
          value: ns-dpn-01
        - name: name
          value: dpn-consumer-topic-extractor
        - name: imageName
          value: dpn-consumer-topic-extractor
        - name: PRODUCT_NAME
          value: consumer-topic
        - name: SCHEDULER_BACKEND
          value: kafka-trigger
        - name: EXECUTION_MODE
          value: manual
        - name: scheduleInterval
          value: '240'
        - name: replicaCount
          value: '1'
        - name: PIPELINE_CONTROL_TOPIC
          value: dpn-pipeline-control
        - name: PIPELINE_STATUS_TOPIC
          value: dpn-pipeline-status
        - name: DRAIN_IDLE_SECS
          value: '15'
        - name: TOPIC_TASK_TIMEOUT_SECS
          value: '60'
        - name: statsdPort
          value: '8125'
        - name: SERVICE_NAME
          value: dpn data pipeline
        - name: SERVICE_VERSION
          value: 1.0.0
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: dpn-otel-collector.ns-dpn-health-01.svc.cluster.local:4317  # cross-namespace soft dependency on 02-health-monitor
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: ENVIRONMENT
          value: development
        image: ghcr.io/energy-dsi/consumer-topic-extractor:1.0.0
        imagePullPolicy: Always
        name: dpn-consumer-topic-extractor
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10000
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-pull-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: federator-server
      serviceAccountName: federator-server
      terminationGracePeriodSeconds: 30
