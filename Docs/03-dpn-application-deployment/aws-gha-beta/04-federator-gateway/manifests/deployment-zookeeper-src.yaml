# ===== deploy/dpn-zookeeper-src =====
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dpn-zookeeper-src
  name: dpn-zookeeper-src
  namespace: ns-dpn-01
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dpn-zookeeper-src
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-dotnet: 'false'
        cloudwatch.aws.amazon.com/auto-annotate-java: 'false'
        cloudwatch.aws.amazon.com/auto-annotate-nodejs: 'false'
        cloudwatch.aws.amazon.com/auto-annotate-python: 'false'
        instrumentation.opentelemetry.io/inject-dotnet: 'false'
        instrumentation.opentelemetry.io/inject-java: 'false'
        instrumentation.opentelemetry.io/inject-nodejs: 'false'
        instrumentation.opentelemetry.io/inject-python: 'false'
      labels:
        app: dpn-zookeeper-src
    spec:
      containers:
      - env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: '2181'
        - name: ZOOKEEPER_SERVER_ID
          value: '1'
        - name: ZOOKEEPER_SERVERS
          value: dpn-zookeeper-src:2888:3888
        image: confluentinc/cp-zookeeper:7.5.3
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 2181
          timeoutSeconds: 1
        name: zookeeper
        ports:
        - containerPort: 2181
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: 2181
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-pull-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
