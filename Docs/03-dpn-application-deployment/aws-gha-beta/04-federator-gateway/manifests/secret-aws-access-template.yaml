# *** TEMPLATE ONLY — DO NOT COMMIT WITH REAL VALUES. ***
#
# This Secret backs AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the file-pipeline pods
# (producer-file-*, consumer-file-*) that talk to S3. The old copy of this file in the source
# repo contained a REAL, LIVE AWS access key committed in plaintext (base64-of-base64 encoded).
# That key has been fully removed during this reorg and is NOT reproduced anywhere in this
# bundle — treat it as compromised and rotate/deactivate it if it is still active.
#
# RECOMMENDED: do NOT `kubectl apply -f` this file directly. Create the secret imperatively
# instead, so real credentials never touch a file on disk or a git history:
#
#   kubectl -n ns-dpn-01 create secret generic aws-access-secret \
#     --from-literal=AWS_ACCESS_KEY_ID='<your-access-key-id>' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='<your-secret-access-key>'
#
# See RUNBOOK.md section 3.2 for the full recommended flow (including creating a dedicated
# least-privilege IAM user scoped to scripts/s3-access-policy.json).
#
# *** IMPORTANT — the file-pipeline apps self-decode these values with base64.b64decode() in
# Python before use. If you DO apply this template (e.g. for local testing), the values you put
# under stringData must be the BASE64-ENCODING of the actual key/secret, not the raw string:
#   printf '%s' '<your-access-key-id>'     | base64 -w0
#   printf '%s' '<your-secret-access-key>' | base64 -w0
# Getting this wrong produces: binascii.Error: Invalid base64-encoded string
apiVersion: v1
kind: Secret
metadata:
  name: aws-access-secret
  namespace: ns-dpn-01
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "<AWS_ACCESS_KEY_ID>"       # placeholder — base64-encode your real key before use (see note above)
  AWS_SECRET_ACCESS_KEY: "<AWS_SECRET_ACCESS_KEY>"  # placeholder — base64-encode your real secret before use (see note above)
